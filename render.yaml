services:
  # ─────────────────────────────────────────────────────────────
  # CareerPilot Backend API (Node.js + Express + LangChain)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: careerpilot-api
    runtime: node
    rootDir: server
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: CHROMA_URL
        value: http://localhost:8000

  # ─────────────────────────────────────────────────────────────
  # CareerPilot Frontend Web App (React + Vite SPA)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: careerpilot-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: careerpilot-api
          property: host
